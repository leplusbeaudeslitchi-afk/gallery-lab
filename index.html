function hardenRecommendations(d){
 const walker=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);
 const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
 nodes.forEach(n=>{
   const t=n.nodeValue||"";
   if(t.includes("Premier proprio à vérifier en jeu")) n.nodeValue=t.replace("Premier proprio à vérifier en jeu","À vérifier en jeu · non confirmé");
 });
 const candidates=[...d.querySelectorAll("div,section,details")].filter(el=>/À vérifier en jeu · non confirmé/.test(el.textContent||""));
 candidates.forEach(el=>{
   if(el.dataset.safetyMarked)return; el.dataset.safetyMarked="1";
   const note=d.createElement("div"); note.className="gl-confidence";
   note.innerHTML='<b>? DONNÉES NON CONFIRMÉES</b><span>Ces gains sont des scénarios conditionnels. Ne dépense rien sur cette base tant que les cartes Premier proprio ne sont pas confirmées en jeu.</span>';
   el.insertBefore(note,el.firstChild);
 });
}


const GL_FUTGG_BASE="https://www.fut.gg/api/fut";
const GL_ASSET="https://game-assets.fut.gg/cdn-cgi/image/quality=90,format=auto,width=300/";
function glNorm(x){return (x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
function glPick(rows,card){
 const rating=card.querySelector(".rt")?.textContent.trim();
 const pos=card.querySelector(".ps")?.textContent.trim();
 return rows.find(x=>String(x.game)==="26"&&String(x.overall)===rating)||
        rows.find(x=>String(x.game)==="26")||
        rows.find(x=>String(x.overall)===rating)||rows[0];
}
async function glFetchJson(url){const r=await fetch(url,{credentials:"omit",mode:"cors"});if(!r.ok)throw Error(r.status);return r.json()}
async function glResolveGx(card){
 if(card.dataset.glDone)return; card.dataset.glDone="1";
 const nm=(card.querySelector(".nm")?.textContent||"").trim();
 let rows=[];
 try{
   const hid=(nm.match(/#(\d+)/)||[])[1];
   if(hid){
     const j=await glFetchJson(GL_FUTGG_BASE+"/players/v2/all-versions/"+hid+"/");
     rows=j.data||[];
   }else{
     const q=encodeURIComponent(nm);
     let j;
     try{j=await glFetchJson(GL_FUTGG_BASE+"/players/26/?search="+q)}catch(_){j=await glFetchJson(GL_FUTGG_BASE+"/players/v2/?game=26&search="+q)}
     rows=j.data?.results||j.results||j.data||[];
     if(!Array.isArray(rows))rows=[];
     rows=rows.filter(x=>glNorm(x.commonName||x.lastName||x.searchableName).includes(glNorm(nm)));
   }
   const p=glPick(rows,card); if(!p)return;
   const path=p.futggCardImagePath||p.simpleCardImagePath||p.cardImagePath||p.imagePath;if(!path)return;
   const img=card.ownerDocument.createElement("img");img.className="gl-futgg-img";img.alt=p.commonName||nm;img.src=GL_ASSET+path;
   const head=card.querySelector(".gx-ph"); if(head)head.insertAdjacentElement("afterend",img); else card.prepend(img);
   if(/^Héros #/.test(nm)){const ne=card.querySelector(".nm");if(ne)ne.textContent=p.commonName||p.nickname||p.lastName||nm}
 }catch(e){card.dataset.glError=String(e)}
}
function glEnhanceCards(d){d.querySelectorAll(".gx-p").forEach(glResolveGx)}
