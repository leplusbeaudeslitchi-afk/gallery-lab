<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090c12"><title>GalleryLab · FC27</title>
<style>html,body,#app{margin:0;width:100%;height:100%;border:0;background:#090c12}body{overflow:hidden}#app{display:block}
/* GalleryLab simplified UI */
#gl-simple-hide{display:none!important}
body{--gl-muted:#8f9baa}
.gx-p .gl27-art{min-height:150px}
.gx-p .gl27-art img{width:100%;height:100%;object-fit:contain}
@media(max-width:700px){.gx-p .gl27-art{min-height:125px}}
</style></head>
<body><iframe id="app" src="./app.html" title="GalleryLab FC27"></iframe>
<script>
const frame=document.getElementById('app');
frame.addEventListener('load',()=>{
 const d=frame.contentDocument;if(!d)return;
 const s=d.createElement('style');s.id='gl27-ui';s.textContent=`
 :root,:root[data-theme="light"],:root[data-theme="dark"]{--bg:#090c12!important;--bg2:#0d1119!important;--panel:#111722!important;--panel2:#151c28!important;--line:#253044!important;--ink:#f4f7fb!important;--muted:#8e9aab!important;--field:#0b1018!important;--accent:#8b5cf6!important;--accent-ink:#fff!important}
 html,body{background:#090c12!important;color:#f4f7fb!important;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif!important}
 .app{min-height:100vh!important;background:radial-gradient(circle at 75% -10%,rgba(124,92,255,.15),transparent 35%),#090c12!important}
 .side{background:rgba(10,14,21,.96)!important;border-color:#202a3a!important;box-shadow:none!important}
 .brand,.brand span,.snav a[aria-current="page"]{color:#fff!important}.brand small,.muted,.small.muted{color:#8e9aab!important}
 .snav a{color:#98a4b5!important;border-radius:12px!important}.snav a:hover,.snav a[aria-current="page"]{background:#171e2b!important}
 .wrap{max-width:1500px!important;margin:auto!important}
 h1,h2,h3,.t,.nm{color:#f7f9fc!important}
 .panel,.card2,.kpi,.planner,.upcard,.setcard,.card{background:#111722!important;border:1px solid #253044!important;box-shadow:0 14px 38px rgba(0,0,0,.22)!important}
 .toolbar{background:#111722!important;border-color:#253044!important}
 input,select,textarea,.pstat input{background:#0b1018!important;color:#f4f7fb!important;border:1px solid #2a3649!important}
 input::placeholder{color:#687487!important}
 .planner .head,.planres,.card .top{background:#111722!important;border-color:#253044!important}
 .pstats{background:#0e141e!important}.pstat{background:#131a26!important;border:1px solid #253044!important}.pstat span{color:#7f8da1!important}.pstat b{color:#fff!important}
 .btn:not(.ghost){background:linear-gradient(135deg,#7c5cff,#9b6cff)!important;color:#fff!important;border:0!important}.btn.ghost{background:#151c28!important;color:#e9eef7!important;border-color:#2b374a!important}
 .tabs2{background:#0b1018!important;border-color:#253044!important}.tabs2 button{color:#8e9aab!important}.tabs2 button[aria-pressed="true"]{background:#1b2432!important;color:#fff!important}
 .setcard{border-radius:18px!important}.gbox{background:#131a26!important;border-color:#2a3649!important}
 .gx-p{position:relative!important;overflow:hidden!important;background:linear-gradient(160deg,#151d2a,#0c111a)!important;border:1px solid #2a3649!important;border-radius:18px!important;min-height:250px!important}
 .gx-p:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 25%,rgba(139,92,246,.15),transparent 42%);pointer-events:none}
 .gx-p .nm,.gx-p .sub,.gx-p .ft,.gx-p .gx-ph{position:relative;z-index:1}
 @media(max-width:820px){.app{display:block!important}.side{position:sticky!important;top:0!important;width:100%!important;height:auto!important;min-height:0!important;z-index:99!important;padding:8px!important;overflow-x:auto!important}.side .brand,.side-foot,.snav p{display:none!important}.snav{display:flex!important;gap:6px!important;min-width:max-content!important}.snav a{padding:10px 12px!important;font-size:12px!important}.wrap{padding:18px 12px 70px!important;width:auto!important}.phead h1,.hero h1{font-size:2rem!important}.pstats{grid-template-columns:1fr 1fr!important}.toolbar{flex-wrap:wrap!important}.gx-grid,.players-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.gx-p{min-height:210px!important}}
 `;d.head.appendChild(s);
 try{d.documentElement.dataset.theme='dark';localStorage.setItem('gallerylab-theme','dark')}catch(e){}
});

/* FC27 live player-card enhancer */
const norm=s=>(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const cache=new Map();
let glMapPromise;
async function futggPlayer(name,rating){
 const key=norm(name); if(!key||key.startsWith("heros ")) return null;
 const ck=key+"|"+(rating||""); if(cache.has(ck)) return cache.get(ck);
 const p=(async()=>{try{
   glMapPromise ||= fetch("./futgg-map.json?ts="+Math.floor(Date.now()/600000),{cache:"no-store"}).then(r=>r.ok?r.json():({})).catch(()=>({}));
   const map=await glMapPromise, rows=map[key]||[];
   if(!Array.isArray(rows)) return rows?.image||null;
   const exact=rows.find(x=>Number(x.rating)===Number(rating));
   return (exact||rows[0])?.image||null;
 }catch(e){return null}})(); cache.set(ck,p); return p;
}
function enhancePlayers(d){
 d.querySelectorAll(".gx-p").forEach(async card=>{
   if(card.dataset.gl27)return; card.dataset.gl27="1";
   const nm=card.querySelector(".nm"); if(!nm)return;
   const name=nm.textContent.trim();
   const art=d.createElement("div"); art.className="gl27-art";
   card.insertBefore(art,card.firstChild);
   const rating=card.querySelector(".rt")?.textContent.trim(); const url=await futggPlayer(name,rating);
   if(url){const img=d.createElement("img");img.loading="lazy";img.alt=name;img.src=url;art.appendChild(img);card.classList.add("gl27-hasart")}
 });
}
function installRuntime(d){
 const extra=d.createElement("style"); extra.textContent=`
 .gl27-art{height:230px;display:grid;place-items:end center;position:relative;z-index:1;margin:-2px -2px 8px;overflow:hidden}
 .gl27-art:empty:after{content:"FC 27";font-weight:900;font-size:34px;letter-spacing:-2px;color:rgba(255,255,255,.07);place-self:center}
 .gl27-art img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 14px 20px rgba(0,0,0,.35))}
 .gx-p.gl27-hasart{min-height:350px!important}.gx-p.gl27-hasart .gx-ph{position:absolute!important;top:12px;left:12px}
 .gx-p .nm{font-size:15px!important;font-weight:800!important}.gx-p .sub{color:#8e9aab!important}
 @media(max-width:820px){.gl27-art{height:170px}.gx-p.gl27-hasart{min-height:285px!important}.gx-p{border-radius:14px!important}.gx-p .nm{font-size:13px!important}}
 `; d.head.appendChild(extra);
 enhancePlayers(d);
 new MutationObserver(()=>enhancePlayers(d)).observe(d.body,{childList:true,subtree:true});
}
frame.addEventListener("load",()=>{const d=frame.contentDocument;if(d)installRuntime(d)});

function glSimplify(){
 const junk=[...document.querySelectorAll("h1,h2,h3,h4,p,button,a,summary,span,div")];
 const bad=/^(comment ça marche|comment ca marche|aide|faq|guide|bienvenue|pour commencer|mode d'emploi|astuce|conseil)/i;
 junk.forEach(el=>{const t=(el.textContent||"").trim(); if(t.length<90&&bad.test(t)&&!el.closest(".gx-p")){const box=el.closest("section,.card,.panel,.box,details")||el;box.style.display="none"}});
 // Keep navigation focused on actual GalleryLab actions.
 document.querySelectorAll("nav a,aside a,.sidebar a").forEach(a=>{
   const t=(a.textContent||"").trim();
   if(/^(aide|faq|comment ça marche|comment ca marche)$/i.test(t)) a.style.display="none";
 });
}
new MutationObserver(glSimplify).observe(document.documentElement,{subtree:true,childList:true});
setTimeout(glSimplify,200);

function glFocusSets(){
 document.querySelectorAll("nav a,aside a,.sidebar a,button").forEach(a=>{
   const t=(a.textContent||"").trim();
   if(/^marché$/i.test(t)||/^marche$/i.test(t)) a.style.display="none";
 });
 // Hide standalone market views/sections when identifiable, while preserving price labels inside Set player cards.
 document.querySelectorAll("[id],[data-page],[data-view]").forEach(el=>{
   const id=((el.id||"")+" "+(el.getAttribute("data-page")||"")+" "+(el.getAttribute("data-view")||"")).toLowerCase();
   if(/(^|[-_ ])market|marche|marché/.test(id)&&!el.closest(".gx-p")) el.style.display="none";
 });
}
new MutationObserver(glFocusSets).observe(document.documentElement,{subtree:true,childList:true});
setTimeout(glFocusSets,250);
</script></body></html>
